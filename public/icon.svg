    <path d="M225 110 C210 130 190 150 180 180 C170 210 175 230 160 250 C145 270 140 280 160 300 C175 315 200 305 210 295 C220 285 220 270 235 275 C250 280 260 305 250 340 H315 C330 300 345 240 330 200 C320 170 300 145 275 125 C265 117 250 102 240 95 C235 100 230 105 225 110 Z" />
